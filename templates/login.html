<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MockMaster AI — Sign In</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .auth-footer { margin-top: 24px; font-size: 14px; color: var(--text-muted); }
        .auth-footer a { color: var(--primary-light); text-decoration: none; font-weight: 600; }
        .auth-footer a:hover { text-decoration: underline; }
        .brand-hero { margin-bottom: 32px; }
        .brand-hero .logo-big { font-size: 40px; margin-bottom: 8px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand">
            <div class="logo-icon">🎯</div>
            MockMaster AI
        </a>
        <span class="navbar-tag">Beta</span>
    </nav>

    <div class="page-wrapper">
        <div class="container">

            <div class="brand-hero">
                <div class="logo-big">👋</div>
                <h1>Welcome Back</h1>
                <p class="subtitle">Sign in to continue your interview preparation journey.</p>
            </div>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for message in messages %}
                        <div class="flash-message">⚠️ {{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="/login" method="POST">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="john@example.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Your password" required>
                </div>
                <button type="submit" style="width:100%;">Sign In →</button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="/register">Create one free</a>
            </div>
        </div>
    </div>
</body>
</html>
