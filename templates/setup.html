<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Mock Interview App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script>
        const rolesData = {
            "Software Engineering": [
                "Software Development Engineer (SDE)",
                "Frontend Developer",
                "Backend Developer",
                "Full Stack Developer",
                "Mobile Developer (iOS/Android)"
            ],
            "Data & AI": [
                "Data Analyst",
                "Data Scientist",
                "Machine Learning Engineer",
                "Data Engineer"
            ],
            "Design & Product": [
                "Product Manager",
                "UX/UI Designer",
                "Product Designer"
            ],
            "IT & Infrastructure": [
                "DevOps Engineer",
                "Cloud Architect",
                "Cybersecurity Analyst"
            ],
            "Business & Other": [
                "Business Analyst",
                "Marketing Manager",
                "Sales / Account Manager",
                "General / Other"
            ]
        };

        function updateRoles() {
            const categorySelect = document.getElementById("category");
            const roleSelect = document.getElementById("role");
            const selectedCategory = categorySelect.value;
            
            roleSelect.innerHTML = '<option value="" disabled selected>Select a role...</option>';
            
            if (selectedCategory && rolesData[selectedCategory]) {
                rolesData[selectedCategory].forEach(function(role) {
                    const option = document.createElement("option");
                    option.value = role;
                    option.textContent = role;
                    roleSelect.appendChild(option);
                });
            }
        }
        
        function showLoading(form) {
            form.querySelector('#submit-btn').style.display = 'none';
            form.querySelector('#loading-ui').style.display = 'block';
        }
    </script>
</head>
<body>
    <div class="container">
        <!-- Display Flash Error Messages -->
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="flash-message">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <h1>Step 2: Interview Setup</h1>
        <p>Awesome! We've analyzed your resume. Now, what kind of interview are you preparing for?</p>
        
        <form action="/save_setup" method="POST" onsubmit="showLoading(this)">
            <div class="form-group">
                <label for="interview_type">Interview Type:</label>
                <select name="interview_type" id="interview_type" required>
                    <option value="" disabled selected>Select a type...</option>
                    <option value="Technical">Technical (Coding / Algorithms)</option>
                    <option value="HR/Behavioral">HR / Behavioral</option>
                    <option value="System Design">System Design</option>
                    <option value="Case Study">Case Study / Consulting</option>
                    <option value="Management">Management / Leadership</option>
                    <option value="Pair Programming">Pair Programming</option>
                </select>
            </div>

            <div class="form-group">
                <label for="category">Job Category:</label>
                <select id="category" onchange="updateRoles()" required>
                    <option value="" disabled selected>Select a category...</option>
                    <option value="Software Engineering">Software Engineering</option>
                    <option value="Data & AI">Data & AI</option>
                    <option value="Design & Product">Design & Product</option>
                    <option value="IT & Infrastructure">IT & Infrastructure</option>
                    <option value="Business & Other">Business & Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="role">Target Role:</label>
                <select name="role" id="role" required>
                    <option value="" disabled selected>Select a category first...</option>
                </select>
            </div>
            
            <button type="submit" id="submit-btn">Prepare Questions</button>
            <div id="loading-ui" class="loading-text">
                Generating customized questions... <div class="loader"></div>
            </div>
        </form>
    </div>
</body>
</html>
