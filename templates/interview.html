<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Mock Interview App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script>
        function showLoading(form) {
            form.querySelector('#submit-btn').style.display = 'none';
            form.querySelector('#loading-ui').style.display = 'block';
        }
    </script>
</head>
<body>
    <div class="container" style="max-width: 800px;">
        <p style="color: #6c757d; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;">
            Question {{ current }} of {{ total }}
        </p>
        
        <h2 style="margin-top: 5px; color: #0056b3; margin-bottom: 25px;">{{ question }}</h2>
        
        <form action="/submit_answer" method="POST" onsubmit="showLoading(this)">
            <textarea name="answer" rows="10" placeholder="Type your answer here..." required autofocus></textarea>
            <br>
            <button type="submit" id="submit-btn">
                {% if current == total %}
                    Finish Interview
                {% else %}
                    Next Question
                {% endif %}
            </button>
            
            <div id="loading-ui" class="loading-text">
                {% if current == total %}
                    Grading your interview... this might take a minute! 
                {% else %}
                    Saving answer...
                {% endif %}
                <div class="loader"></div>
            </div>
        </form>
    </div>
</body>
</html>
