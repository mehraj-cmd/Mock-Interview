<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MockMaster AI — Interview</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script>
        function showLoading(form) {
            form.querySelector('#submit-btn').style.display = 'none';
            form.querySelector('#loading-ui').style.display = 'flex';
        }
    </script>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <a href="/" class="navbar-brand">
            <div class="logo-icon">🎯</div>
            MockMaster AI
        </a>
        <span class="navbar-tag">Interview Active</span>
    </nav>

    <div class="page-wrapper">
        <div class="container" style="max-width: 780px;">
            
            <!-- Step Indicator -->
            <div class="step-indicator">
                <div class="step-dot completed">✓</div>
                <div class="step-line completed"></div>
                <div class="step-dot completed">✓</div>
                <div class="step-line completed"></div>
                <div class="step-dot active">3</div>
                <div class="step-line"></div>
                <div class="step-dot">4</div>
            </div>

            <!-- Progress Bar -->
            <div class="progress-bar-container">
                <div class="progress-bar-fill" style="width: {{ (current / total * 100) | int }}%;"></div>
            </div>
            
            <span class="question-number">Question {{ current }} of {{ total }}</span>
            
            <div class="question-text">{{ question }}</div>
            
            <form action="/submit_answer" method="POST" onsubmit="showLoading(this)">
                <textarea name="answer" rows="10" placeholder="Take your time and answer as if you're in a real interview..." required autofocus></textarea>
                
                <button type="submit" id="submit-btn">
                    {% if current == total %}
                        🏁 Finish & Get Results
                    {% else %}
                        Next Question →
                    {% endif %}
                </button>
                
                <div id="loading-ui" class="loading-text" style="display:none; align-items:center; justify-content:center;">
                    {% if current == total %}
                        📊 Grading your full interview — this may take a moment
                    {% else %}
                        Saving...
                    {% endif %}
                    <div class="loader"></div>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
