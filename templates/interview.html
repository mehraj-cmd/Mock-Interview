<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MockMaster AI — Interview</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script>
        async function submitAnswer(event) {
            event.preventDefault();
            const form = event.target;
            const submitBtn = document.getElementById('submit-btn');
            const loadingUi = document.getElementById('loading-ui');
            const errorContainer = document.getElementById('error-container');
            const textarea = form.querySelector('textarea[name="answer"]');

            if (!textarea.value.trim()) {
                if (errorContainer) {
                    errorContainer.textContent = "⚠️ Please type your answer before proceeding.";
                    errorContainer.style.display = "block";
                }
                return;
            }

            if (errorContainer) errorContainer.style.display = "none";
            submitBtn.style.display = "none";
            loadingUi.style.display = "flex";

            try {
                const formData = new FormData(form);
                const response = await fetch('/submit_answer', {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    window.location.href = data.redirect;
                } else {
                    throw new Error(data.error || 'Server reported failure while saving your answer.');
                }
            } catch (err) {
                loadingUi.style.display = "none";
                submitBtn.style.display = "inline-block";
                if (errorContainer) {
                    errorContainer.textContent = "❌ Failed to save answer: " + err.message + " Please click Next Question to retry.";
                    errorContainer.style.display = "block";
                }
            }
        }
    </script>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <a href="/" class="navbar-brand">
            <div class="logo-icon">🎯</div>
            MockMaster AI
        </a>
        <span class="navbar-tag">Interview Active</span>
    </nav>

    <div class="page-wrapper">
        <div class="container" style="max-width: 780px;">
            
            <!-- Step Indicator -->
            <div class="step-indicator">
                <div class="step-dot completed">✓</div>
                <div class="step-line completed"></div>
                <div class="step-dot completed">✓</div>
                <div class="step-line completed"></div>
                <div class="step-dot active">3</div>
                <div class="step-line"></div>
                <div class="step-dot">4</div>
            </div>

            <!-- Progress Bar -->
            <div class="progress-bar-container">
                <div class="progress-bar-fill" style="width: {{ (current / total * 100) | int }}%;"></div>
            </div>
            
            <div id="error-container" class="flash-message" style="display: none; background-color: #f8d7da; color: #721c24; border-color: #f5c6cb; margin-bottom: 20px;"></div>

            <span class="question-number">Question {{ current }} of {{ total }}</span>
            
            <div class="question-text">{{ question }}</div>
            
            <form action="/submit_answer" method="POST" onsubmit="submitAnswer(event)">
                <textarea name="answer" rows="10" placeholder="Take your time and answer as if you're in a real interview..." required autofocus>{{ existing_answer if existing_answer else '' }}</textarea>
                
                <button type="submit" id="submit-btn">
                    {% if current == total %}
                        🏁 Finish & Get Results
                    {% else %}
                        Next Question →
                    {% endif %}
                </button>
                
                <div id="loading-ui" class="loading-text" style="display:none; align-items:center; justify-content:center;">
                    {% if current == total %}
                        📊 Grading your full interview — this may take a moment
                    {% else %}
                        Saving...
                    {% endif %}
                    <div class="loader"></div>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
